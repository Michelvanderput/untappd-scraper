name: Daily Beer Menu Scraper

on:
  schedule:
    # Draait 3x per dag voor frequentere updates
    - cron: '0 6 * * *'   # 06:00 UTC (07:00 CET / 08:00 CEST) - Ochtend
    - cron: '0 12 * * *'  # 12:00 UTC (13:00 CET / 14:00 CEST) - Middag
    - cron: '0 18 * * *'  # 18:00 UTC (19:00 CET / 20:00 CEST) - Avond
  workflow_dispatch: # Handmatig kunnen triggeren

# Never let two scrapes (e.g. a delayed schedule plus a manual re-run) push at the same time
concurrency:
  group: scrape-daily
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    # A normal run takes well under a minute; fail fast instead of hanging for hours
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies
        run: npm install
      
      - name: Backup old beers.json
        run: |
          if [ -f beers.json ]; then
            cp beers.json beers.old.json
          fi
      
      - name: Run scraper
        timeout-minutes: 3
        run: node scrape.js
      
      - name: Detect changes and create changelog
        run: node detect-changes.js
      
      - name: Commit and push if changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add beers.json changelog.json scrape-log.json
          
          if git diff --staged --quiet; then
            echo "No changes detected"
          else
            git commit -m "🍺 Update beer menu - $(date +'%Y-%m-%d %H:%M')"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
